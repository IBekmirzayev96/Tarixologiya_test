<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarix testlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#1b1f3b; --muted:#646b85; --line:#e3e6f2;
  --accent:#4f46e5; --accent-ink:#ffffff; --gold:#b45309; --ok:#15803d; --bad:#b91c1c;
  --c-milliy:#4f46e5; --c-attestatsiya:#059669; --c-mavzuli:#d97706;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1226; --card:#171a35; --ink:#eceefb; --muted:#9aa1c4; --line:#292d52;
        --accent:#8b85ff; --accent-ink:#13153a; --gold:#f0b44c; --ok:#4cc38a; --bad:#ff8a80;
        --c-milliy:#8b85ff; --c-attestatsiya:#34d399; --c-mavzuli:#fbbf24;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Literata,Georgia,serif;line-height:1.25;margin:0 0 .5em}
.shell{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Literata,Georgia,serif;font-weight:700;font-size:1.25rem;padding:4px 8px 18px;display:flex;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;flex:none}
.ico.logo{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.ico.a{background:#e0e7ff}.ico.b{background:#d1fae5}.ico.c{background:#fef3c7}.ico.d{background:#fee2e2}
button.nv{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;width:100%;font-weight:500}
button.nv:hover{background:var(--bg)}
.content{flex:1;min-width:0}
main{max-width:1000px;margin:0 auto;padding:28px 20px 64px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.danger{color:var(--bad)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:30px;margin-bottom:22px}
.hero h1{color:#fff;font-size:1.9rem;margin:0 0 8px}
.hero p{margin:0 0 16px;max-width:560px;opacity:.92}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:99px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cc,var(--line));border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--muted)}
.c-milliy{--cc:var(--c-milliy)}.c-attestatsiya{--cc:var(--c-attestatsiya)}.c-mavzuli{--cc:var(--c-mavzuli)}
.badge{align-self:flex-start;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.price{font-weight:700;color:var(--gold)}
.meta{color:var(--muted);font-size:.9rem}
.spacer{flex:1}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:520px;margin:0 auto}
.wide{max-width:none}
.err{color:var(--bad);margin-top:10px}
.authwrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:75vh}
.authwrap .panel{margin:0;max-width:none;width:100%}
.authhero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:38px}
.authhero h1{color:#fff;font-size:2.1rem;margin:0 0 10px}
.authhero p{margin:0;opacity:.92}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt input{width:auto;margin-top:5px}
.opt.right{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.timer{position:sticky;top:10px;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between}
.score{font-family:Literata,Georgia,serif;font-size:2.4rem;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border-radius:99px}
.tabs .on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.tag{font-size:.85rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}

.scrim,.topbar{display:none}
button.nv.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
button.nv:disabled{opacity:.55;cursor:default}
.nt{display:flex;flex-direction:column;line-height:1.25}
.nt small{color:var(--muted);font-weight:400;font-size:.8rem}
.brand em{color:var(--accent);font-style:normal}
.brand span:last-child{line-height:1.1}
.ico.big{width:52px;height:52px;border-radius:15px;font-size:1.5rem}
.ico.e{background:#e0f2fe}.ico.f{background:#dcfce7}.ico.g{background:#fce7f3}
.c-milliy .ico,.c-attestatsiya .ico,.c-mavzuli .ico{background:color-mix(in srgb,var(--cc) 16%,transparent)}
.hero2{background:linear-gradient(135deg,#1e1b4b,#4338ca 60%,#6d28d9);color:#fff;border-radius:22px;padding:34px 30px;margin-bottom:28px}
.hero2 h1{color:#fff;font-size:clamp(1.8rem,5vw,2.8rem);margin:14px 0 10px}
.hero2 h1 em{font-style:normal;color:#fcd34d}
.hero2 p{margin:0 0 20px;max-width:560px;opacity:.92;font-size:1.05rem}
.pill{display:inline-block;background:rgba(255,255,255,.16);padding:5px 14px;border-radius:99px;font-size:.9rem}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.big{padding:12px 22px;font-size:1.02rem;border-radius:12px}
.hero2 .primary{background:#fff;color:#3730a3;border-color:#fff}
.light{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.ghost{display:inline-block;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:12px 22px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:Literata,Georgia,serif;font-size:1.6rem}
.stats span{opacity:.8;font-size:.9rem}
.sec{margin:28px 0 6px}
.sub{margin:0 0 14px}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fc{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font:inherit;color:var(--ink)}
button.fc{cursor:pointer}
.fc b{display:block}.fc small{color:var(--muted);font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.steps i{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:700}
.steps span{color:var(--muted);font-size:.92rem}
.pagehead{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:16px;padding:18px;margin-bottom:8px}
.pagehead h2{margin:0}
@media (max-width:760px){
  .shell{display:block}
  aside{position:fixed;z-index:30;top:0;left:0;bottom:0;height:auto;width:280px;transform:translateX(-100%);overflow-y:auto}
  body.open aside{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none}
  body.open .scrim{opacity:1;pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
  .burger{font-size:1.2rem;padding:6px 12px}
  .tb-brand{font-family:Literata,Georgia,serif;font-weight:700}
  .authwrap{grid-template-columns:1fr}
  .timer{top:62px}
  main{padding:18px 14px 56px}
  .hero2{padding:26px 20px}
}
@media (prefers-reduced-motion:no-preference){aside{transition:transform .2s}}
</style>
</head>
<body>
<div class="shell"><div class="scrim" onclick="toggleNav(false)"></div><aside id="nav"></aside><div class="content"><div class="topbar"><button class="burger" onclick="toggleNav()" aria-label="Menyu">☰</button><span class="tb-brand">Tarix testlari</span></div><main id="app"><p>Yuklanmoqda…</p></main></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Sozlamalar (URL, kalit, karta) config.js faylida turadi */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const nav = document.getElementById("nav");
let me = null, profile = null, timerId = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const som = n => n > 0 ? Number(n).toLocaleString("ru-RU") + " so‘m" : "Bepul";
const isAdmin = () => profile && profile.role === "admin";
const stopTimer = () => { if (timerId) clearInterval(timerId); timerId = null; };

const CATS = { milliy: "Milliy sertifikat", attestatsiya: "Attestatsiya", mavzuli: "Mavzuli testlar" };
let homeFilter = "all";
const hero = n => `<div class="hero"><h1>Tarix fanidan testlar</h1>
  <p>Milliy sertifikat, attestatsiya va mavzuli testlarga tayyorlaning. Natijani darhol ko‘ring va xatolaringizni tahlil qiling.</p>
  <div class="chips"><span>📚 ${n} ta test</span><span>⏱ Vaqt hisoblagich</span><span>✅ Avtomatik baholash</span></div></div>`;
const filterBar = () => `<div class="tabs">` +
  [["all", "Hammasi"], ...Object.entries(CATS)].map(([k, v]) =>
    `<button class="${homeFilter === k ? "on" : ""}" onclick="homeFilter='${k}';showHome()">${v}</button>`).join("") + `</div>`;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  me = session ? session.user : null;
  if (me) {
    const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
    profile = data;
  }
  renderNav();
  showHome();
}

let view = "home";
function setView(v) { view = v; renderNav(); toggleNav(false); }
function toggleNav(v) { document.body.classList.toggle("open", v); }

const CAT_ICON = { milliy: "🎖", attestatsiya: "🧑‍🏫", mavzuli: "📚" };
const CAT_DESC = {
  milliy: "Milliy sertifikat imtihoniga tayyorgarlik testlari",
  attestatsiya: "O‘qituvchilar attestatsiyasiga tayyorgarlik",
  mavzuli: "Tarix mavzulari bo‘yicha qisqa va aniq testlar"
};

function renderNav() {
  const cur = view === "home" ? (homeFilter === "all" ? "home" : homeFilter) : view;
  const b = (k, fn, ic, cls, t, sub) => `<button class="nv ${cur === k ? "on" : ""}" onclick="${fn}"><span class="ico ${cls}">${ic}</span><span class="nt"><b>${t}</b>${sub ? `<small>${sub}</small>` : ""}</span></button>`;
  nav.innerHTML = `<div class="brand"><span class="ico logo">📜</span><span>Tarix<br><em>testlari</em></span></div>` +
    b("home", "showHome('all')", "🏠", "a", "Bosh sahifa") +
    b("milliy", "showHome('milliy')", CAT_ICON.milliy, "b", "Milliy sertifikat", "tayyorgarlik testlari") +
    b("attestatsiya", "showHome('attestatsiya')", CAT_ICON.attestatsiya, "c", "Attestatsiya", "o‘qituvchilar uchun") +
    b("mavzuli", "showHome('mavzuli')", CAT_ICON.mavzuli, "d", "Mavzuli testlar", "mavzular bo‘yicha") +
    `<button class="nv" disabled><span class="ico g">🖼</span><span class="nt"><b>Slaydlar</b><small>tez orada</small></span></button>` +
    `<div class="spacer"></div>` +
    (me
      ? b("my", "showMy()", "📊", "b", "Natijalarim") + (isAdmin() ? b("admin", "showAdmin()", "⚙️", "c", "Admin") : "") + b("out", "logout()", "🚪", "d", "Chiqish")
      : b("in", "showAuth('login')", "🔑", "a", "Kirish") + b("reg", "showAuth('register')", "👤", "b", "Ro‘yxatdan o‘tish"));
}

const landing = (all, loggedIn) => `
  <div class="hero2">
    <span class="pill">● Platforma faol</span>
    <h1>Tarixni testlar orqali <em>puxta</em> o‘rganing</h1>
    <p>Milliy sertifikat va attestatsiyaga tayyorlaning, har bir testdan so‘ng xatolaringizni tahlil qiling.</p>
    <div class="cta">
      ${loggedIn ? "" : `<button class="primary big" onclick="showAuth('register')">Ro‘yxatdan o‘tish</button><button class="light big" onclick="showAuth('login')">Kirish</button>`}
      <a class="ghost big" href="#tests">Testlarni ko‘rish</a>
    </div>
    <div class="stats"><div><b>${all.length}</b><span>test</span></div><div><b>3</b><span>bo‘lim</span></div><div><b>24/7</b><span>istalgan vaqtda</span></div></div>
  </div>
  <h2 class="sec">Platforma imkoniyatlari</h2><p class="meta sub">Barchasi bir joyda: telefon va kompyuterda</p>
  <div class="feat">` +
  Object.keys(CATS).map(k => `<button class="fc c-${k}" onclick="showHome('${k}')"><span class="ico big">${CAT_ICON[k]}</span><span><b>${CATS[k]}</b><small>${CAT_DESC[k]}</small></span></button>`).join("") +
  [["⏱", "e", "Vaqt hisoblagich", "Haqiqiy imtihondagidek vaqt bilan ishlang"],
   ["✅", "f", "Avtomatik baholash", "Natija bir zumda, to‘g‘ri javoblar bilan"],
   ["🖼", "g", "Slaydlar", "O‘qituvchilar uchun tayyor slaydlar, tez orada"]]
    .map(([i, c, t, d]) => `<div class="fc"><span class="ico big ${c}">${i}</span><span><b>${t}</b><small>${d}</small></span></div>`).join("") +
  `</div>
  <h2 class="sec">Qanday ishlaydi?</h2>
  <div class="steps">
    <div><i>1</i><b>Ro‘yxatdan o‘ting</b><span>Ism, email va parol yetarli</span></div>
    <div><i>2</i><b>Testni tanlang</b><span>Bo‘lim bo‘yicha kerakli testni toping</span></div>
    <div><i>3</i><b>Natijani oling</b><span>Xatolaringizni tahlil qiling</span></div>
  </div>`;

const testCard = (x, st) => {
  const open = isAdmin() || x.price === 0 || st[x.id] === "approved";
  const action = !me ? `<button class="primary" onclick="showAuth('login')">Boshlash uchun kiring</button>`
    : open ? `<button class="primary" onclick="startTest('${x.id}')">Testni boshlash</button>`
    : st[x.id] === "pending" ? `<span class="tag">To‘lov tekshirilmoqda</span>`
    : `<button class="primary" onclick="showBuy('${x.id}')">Sotib olish</button>${st[x.id] === "rejected" ? `<span class="err">Oldingi to‘lov qabul qilinmadi</span>` : ""}`;
  return `<div class="card c-${x.category}"><span class="badge">${CATS[x.category] || ""}</span><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>
    <div class="meta">⏱ ${x.duration_min} daqiqa</div><div class="price">${som(x.price)}</div><div class="spacer"></div>${action}</div>`;
};

/* ---------- Kirish / ro‘yxatdan o‘tish ---------- */
function showAuth(mode = "login") {
  stopTimer();
  const reg = mode === "register";
  app.innerHTML = `<div class="authwrap"><div class="authhero"><h1>Tarix testlari</h1><p>Milliy sertifikat, attestatsiya va mavzuli testlar bitta joyda. Natijangizni darhol bilib oling.</p></div><div class="panel">
    <h2>${reg ? "Ro‘yxatdan o‘tish" : "Kirish"}</h2>
    ${reg ? `<label>Ism familiya</label><input id="name" autocomplete="name">` : ""}
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Parol (kamida 6 belgi)</label><input id="pass" type="password" autocomplete="${reg ? "new-password" : "current-password"}">
    <p class="err" id="err"></p>
    <button class="primary" id="go">${reg ? "Ro‘yxatdan o‘tish" : "Kirish"}</button>
    <button id="sw">${reg ? "Akkauntim bor" : "Yangi akkaunt ochish"}</button>
  </div></div>`;
  document.getElementById("sw").onclick = () => showAuth(reg ? "login" : "register");
  document.getElementById("go").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("pass").value;
    const err = document.getElementById("err");
    err.textContent = "";
    const res = reg
      ? await sb.auth.signUp({ email, password, options: { data: { full_name: document.getElementById("name").value.trim() } } })
      : await sb.auth.signInWithPassword({ email, password });
    if (res.error) { err.textContent = "Xatolik: " + res.error.message; return; }
    if (reg && !res.data.session) { err.textContent = "Emailingizga tasdiqlash xati yuborildi. Tasdiqlab, keyin kiring."; return; }
    init();
  };
}

async function logout() { await sb.auth.signOut(); me = null; profile = null; showHome(); }

/* ---------- Testlar ro‘yxati ---------- */
async function showHome(f) {
  if (f) homeFilter = f;
  setView("home");
  stopTimer();
  app.innerHTML = "<p>Yuklanmoqda…</p>";
  const tq = sb.from("tests").select("*").order("created_at", { ascending: false });
  const pq = me ? sb.from("purchases").select("test_id,status").eq("user_id", me.id) : Promise.resolve({ data: [] });
  const [t, p] = await Promise.all([tq, pq]);
  const st = {};
  (p.data || []).forEach(x => { if (st[x.test_id] !== "approved") st[x.test_id] = x.status; });
  const all = t.data || [];
  const list = homeFilter === "all" ? all : all.filter(x => x.category === homeFilter);
  let html = homeFilter === "all"
    ? landing(all, !!me)
    : `<div class="pagehead c-${homeFilter}"><span class="ico big">${CAT_ICON[homeFilter]}</span><div><h2>${CATS[homeFilter]}</h2><p class="meta" style="margin:0">${CAT_DESC[homeFilter]}</p></div></div>`;
  html += `<h2 id="tests" class="sec">${homeFilter === "all" ? "Testlar" : "Mavjud testlar"}</h2>`;
  html += list.length
    ? `<div class="grid">${list.map(x => testCard(x, st)).join("")}</div>`
    : `<p class="meta">${all.length ? "Bu bo‘limda hozircha testlar yo‘q." : "Hozircha testlar yo‘q."}${isAdmin() ? " Admin bo‘limidan test qo‘shing." : ""}</p>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------- To‘lov ---------- */
async function showBuy(testId) {
  const { data: t } = await sb.from("tests").select("*").eq("id", testId).single();
  app.innerHTML = `<div class="panel">
    <h2>${esc(t.title)}</h2>
    <p>Narxi: <span class="price">${som(t.price)}</span></p>
    <p>1. Quyidagi kartaga pul o‘tkazing:</p>
    <pre>${esc(CARD_NUMBER)}\n${esc(CARD_OWNER)}</pre>
    <p>2. To‘lov chekining rasmini (skrinshot) yuklang:</p>
    <input type="file" id="file" accept="image/*,application/pdf">
    <p class="err" id="err"></p>
    <button class="primary" id="send">To‘lovni yuborish</button>
    <button onclick="showHome()">Orqaga</button>
    <p class="meta">Admin to‘lovni tekshirgach, test ochiladi.</p></div>`;
  document.getElementById("send").onclick = async () => {
    const f = document.getElementById("file").files[0];
    const err = document.getElementById("err");
    if (!f) { err.textContent = "Chek rasmini tanlang."; return; }
    const path = `${me.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
    const up = await sb.storage.from("receipts").upload(path, f);
    if (up.error) { err.textContent = "Yuklashda xatolik: " + up.error.message; return; }
    const ins = await sb.from("purchases").insert({ user_id: me.id, test_id: testId, receipt_path: path });
    if (ins.error) { err.textContent = "Xatolik: " + ins.error.message; return; }
    app.innerHTML = `<div class="panel"><h2>Qabul qilindi</h2><p>To‘lovingiz tekshirilmoqda. Tasdiqlangach, test ochiladi.</p>
      <button class="primary" onclick="showHome()">Testlarga qaytish</button></div>`;
  };
}

/* ---------- Testni topshirish ---------- */
async function startTest(testId) {
  stopTimer();
  const [{ data: t }, { data: qs, error }] = await Promise.all([
    sb.from("tests").select("*").eq("id", testId).single(),
    sb.rpc("get_test_questions", { p_test: testId })
  ]);
  if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  if (!qs.length) { app.innerHTML = `<p>Bu testda hali savollar yo‘q.</p><button onclick="showHome()">Orqaga</button>`; return; }
  let left = t.duration_min * 60;
  app.innerHTML = `<h2>${esc(t.title)}</h2>
    <div class="timer"><span>Qolgan vaqt</span><span id="clock"></span></div>` +
    qs.map((q, i) => `<div class="q"><strong>${i + 1}. ${esc(q.body)}</strong>` +
      q.options.map((o, j) => `<label class="opt"><input type="radio" name="q_${q.id}" value="${j}"><span>${esc(o)}</span></label>`).join("") +
      `</div>`).join("") +
    `<button class="primary" id="finish">Testni yakunlash</button>`;
  const clock = document.getElementById("clock");
  const tick = () => { clock.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`; };
  tick();
  const finish = async () => {
    stopTimer();
    const answers = {};
    qs.forEach(q => { const c = document.querySelector(`input[name="q_${q.id}"]:checked`); if (c) answers[q.id] = Number(c.value); });
    const { data, error } = await sb.rpc("submit_attempt", { p_test: testId, p_answers: answers });
    if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
    showResult(t, qs, data);
  };
  document.getElementById("finish").onclick = () => { if (confirm("Testni yakunlaysizmi?")) finish(); };
  timerId = setInterval(() => { left--; tick(); if (left <= 0) finish(); }, 1000);
}

function showResult(t, qs, r) {
  const rv = {}; r.review.forEach(x => rv[x.id] = x);
  window.scrollTo(0, 0);
  app.innerHTML = `<h2>${esc(t.title)}</h2>
    <div class="score">${r.score} / ${r.total}</div>
    <p class="meta">${Math.round(r.score / r.total * 100)}% to‘g‘ri javob</p>
    <button class="primary" onclick="showHome()">Testlarga qaytish</button><h3 style="margin-top:24px">Javoblar tahlili</h3>` +
    qs.map((q, i) => `<div class="q"><strong>${i + 1}. ${esc(q.body)}</strong>` +
      q.options.map((o, j) => {
        const x = rv[q.id];
        const cls = j === x.correct ? "right" : (j === x.chosen ? "wrong" : "");
        return `<div class="opt ${cls}"><span>${esc(o)}${j === x.correct ? " ✓" : ""}${j === x.chosen && j !== x.correct ? " ✗" : ""}</span></div>`;
      }).join("") + `</div>`).join("");
}

/* ---------- Natijalarim ---------- */
async function showMy() {
  setView("my");
  stopTimer();
  const { data } = await sb.from("attempts").select("*, tests(title)").eq("user_id", me.id).order("created_at", { ascending: false });
  app.innerHTML = `<h2>Natijalarim</h2>` + ((data || []).length
    ? data.map(a => `<div class="row"><strong>${esc(a.tests ? a.tests.title : "")}</strong><span class="spacer"></span>
        <span>${a.score} / ${a.total}</span><span class="meta">${new Date(a.created_at).toLocaleString("ru-RU")}</span></div>`).join("")
    : `<p class="meta">Siz hali test topshirmagansiz.</p>`);
}

/* ---------- Admin ---------- */
function showAdmin(tab = "pay") {
  setView("admin");
  stopTimer();
  app.innerHTML = `<h2>Admin panel</h2><div class="tabs">
    <button class="${tab === "pay" ? "on" : ""}" onclick="showAdmin('pay')">To‘lovlar</button>
    <button class="${tab === "new" ? "on" : ""}" onclick="showAdmin('new')">Test qo‘shish</button>
    <button class="${tab === "list" ? "on" : ""}" onclick="showAdmin('list')">Testlar</button></div><div id="tab"></div>`;
  ({ pay: adminPay, new: adminNew, list: adminList })[tab]();
}

async function adminPay() {
  const box = document.getElementById("tab");
  const { data } = await sb.from("purchases").select("*, profiles(full_name), tests(title,price)").order("created_at", { ascending: false });
  if (!(data || []).length) { box.innerHTML = `<p class="meta">To‘lovlar yo‘q.</p>`; return; }
  box.innerHTML = "";
  for (const p of data) {
    let link = "";
    if (p.receipt_path) {
      const s = await sb.storage.from("receipts").createSignedUrl(p.receipt_path, 3600);
      if (s.data) link = `<a href="${s.data.signedUrl}" target="_blank" rel="noopener">Chekni ko‘rish</a>`;
    }
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div><strong>${esc(p.profiles ? p.profiles.full_name : "")}</strong><br>
      <span class="meta">${esc(p.tests ? p.tests.title : "")} · ${som(p.tests ? p.tests.price : 0)}</span></div>
      <span class="spacer"></span>${link}<span class="tag">${p.status}</span>
      ${p.status === "pending" ? `<button class="primary" data-s="approved">Tasdiqlash</button><button class="danger" data-s="rejected">Rad etish</button>` : ""}`;
    row.querySelectorAll("button[data-s]").forEach(b => b.onclick = async () => {
      await sb.from("purchases").update({ status: b.dataset.s }).eq("id", p.id);
      adminPay();
    });
    box.appendChild(row);
  }
}

function parseQuestions(txt) {
  return txt.trim().split(/\n\s*\n/).map(block => {
    const lines = block.trim().split("\n").map(l => l.trim()).filter(Boolean);
    const isOpt = l => /^[A-Da-d][\)\.]/.test(l);
    const isAns = l => /^javob\s*:/i.test(l);
    const ans = lines.find(isAns);
    const options = lines.filter(isOpt).map(l => l.replace(/^[A-Da-d][\)\.]\s*/, ""));
    const body = lines.filter(l => !isOpt(l) && !isAns(l)).join(" ");
    const correct = ans ? "ABCD".indexOf(ans.split(":")[1].trim().toUpperCase()[0]) : -1;
    if (!body || options.length < 2 || correct < 0 || correct >= options.length) throw new Error("Savol formati xato: " + block.slice(0, 60));
    return { body, options, correct };
  });
}

function adminNew() {
  document.getElementById("tab").innerHTML = `<div class="panel wide">
    <label>Bo‘lim</label>
    <select id="t_cat"><option value="milliy">Milliy sertifikat</option><option value="attestatsiya">Attestatsiya</option><option value="mavzuli">Mavzuli testlar</option></select>
    <label>Test nomi</label><input id="t_title">
    <label>Tavsif</label><input id="t_desc">
    <label>Narxi (so‘m, bepul bo‘lsa 0)</label><input id="t_price" type="number" value="0" min="0">
    <label>Davomiyligi (daqiqa)</label><input id="t_dur" type="number" value="30" min="1">
    <label>Savollar</label>
    <textarea id="t_q" rows="12" placeholder="Amir Temur qachon tug‘ilgan?&#10;A) 1320&#10;B) 1336&#10;C) 1360&#10;D) 1405&#10;Javob: B&#10;&#10;Keyingi savol..."></textarea>
    <p class="meta">Har bir savol bo‘sh qator bilan ajratiladi. Variantlar A) B) C) D), oxirida “Javob: B”.</p>
    <p class="err" id="err"></p><button class="primary" id="save">Testni saqlash</button></div>`;
  document.getElementById("save").onclick = async () => {
    const err = document.getElementById("err"); err.textContent = "";
    let qs;
    try { qs = parseQuestions(document.getElementById("t_q").value); } catch (e) { err.textContent = e.message; return; }
    const title = document.getElementById("t_title").value.trim();
    if (!title) { err.textContent = "Test nomini yozing."; return; }
    const { data: t, error } = await sb.from("tests").insert({
      category: document.getElementById("t_cat").value,
      title, description: document.getElementById("t_desc").value.trim(),
      price: Number(document.getElementById("t_price").value) || 0,
      duration_min: Number(document.getElementById("t_dur").value) || 30
    }).select().single();
    if (error) { err.textContent = error.message; return; }
    const r = await sb.from("questions").insert(qs.map((q, i) => ({ ...q, test_id: t.id, position: i })));
    if (r.error) { err.textContent = r.error.message; return; }
    showAdmin("list");
  };
}

async function adminList() {
  const box = document.getElementById("tab");
  const { data } = await sb.from("tests").select("*").order("created_at", { ascending: false });
  box.innerHTML = (data || []).map(t => `<div class="row"><div><strong>${esc(t.title)}</strong><br><span class="meta">${CATS[t.category] || ""} · ${som(t.price)} · ${t.duration_min} daqiqa</span></div>
    <span class="spacer"></span><span class="tag">${t.is_published ? "e‘lon qilingan" : "yashirin"}</span>
    <button data-a="toggle" data-id="${t.id}" data-v="${t.is_published}">${t.is_published ? "Yashirish" : "E‘lon qilish"}</button>
    <button class="danger" data-a="del" data-id="${t.id}">O‘chirish</button></div>`).join("") || `<p class="meta">Testlar yo‘q.</p>`;
  box.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
    if (b.dataset.a === "del") { if (!confirm("Test va uning savollari o‘chiriladi. Davom etasizmi?")) return; await sb.from("tests").delete().eq("id", b.dataset.id); }
    else await sb.from("tests").update({ is_published: b.dataset.v !== "true" }).eq("id", b.dataset.id);
    adminList();
  });
}

init();
