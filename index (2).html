<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarix testlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#18212f; --muted:#5d6877; --line:#dfe3e9;
  --accent:#0f5c63; --accent-ink:#ffffff; --gold:#8a5a00; --ok:#1d7a46; --bad:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151c; --card:#18202a; --ink:#e8ecf1; --muted:#9aa5b4; --line:#2a3441;
        --accent:#3cb4bd; --accent-ink:#06282b; --gold:#e3b04b; --ok:#4cc38a; --bad:#ff8a80;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Literata,Georgia,serif;line-height:1.25;margin:0 0 .5em}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:Literata,Georgia,serif;font-weight:700;font-size:1.25rem;margin-right:auto}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.danger{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--muted)}
.price{font-weight:600;color:var(--gold)}
.meta{color:var(--muted);font-size:.9rem}
.spacer{flex:1}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:520px;margin:0 auto}
.wide{max-width:none}
.err{color:var(--bad);margin-top:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt input{width:auto;margin-top:5px}
.opt.right{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.timer{position:sticky;top:58px;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between}
.score{font-family:Literata,Georgia,serif;font-size:2.4rem;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs .on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.tag{font-size:.85rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>
<body>
<header><div class="bar" id="nav"></div></header>
<main id="app"><p>Yuklanmoqda…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== SOZLAMALAR: faqat shu 4 qatorni o‘zgartiring ===== */
const SUPABASE_URL = "https://vlaqmqytpsndofamgiez.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsYXFtcXl0cHNuZG9mYW1naWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzc1NzAsImV4cCI6MjEwODc1MzU3MH0.h3nXfr1Fd-umrIcljSwZVF_n7Mvv373lsvchdGzQ_yU";
const CARD_NUMBER = "9860080191359381";
const CARD_OWNER = "Bekmirzayev Ilyosjon";
/* ======================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const nav = document.getElementById("nav");
let me = null, profile = null, timerId = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const som = n => n > 0 ? Number(n).toLocaleString("ru-RU") + " so‘m" : "Bepul";
const isAdmin = () => profile && profile.role === "admin";
const stopTimer = () => { if (timerId) clearInterval(timerId); timerId = null; };

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  me = session ? session.user : null;
  if (me) {
    const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
    profile = data;
  }
  renderNav();
  me ? showHome() : showAuth();
}

function renderNav() {
  nav.innerHTML = `<span class="brand">Tarix testlari</span>`;
  if (!me) return;
  nav.innerHTML += `<button onclick="showHome()">Testlar</button>
    <button onclick="showMy()">Natijalarim</button>
    ${isAdmin() ? `<button onclick="showAdmin()">Admin</button>` : ""}
    <button onclick="logout()">Chiqish</button>`;
}

/* ---------- Kirish / ro‘yxatdan o‘tish ---------- */
function showAuth(mode = "login") {
  stopTimer();
  const reg = mode === "register";
  app.innerHTML = `<div class="panel">
    <h2>${reg ? "Ro‘yxatdan o‘tish" : "Kirish"}</h2>
    ${reg ? `<label>Ism familiya</label><input id="name" autocomplete="name">` : ""}
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Parol (kamida 6 belgi)</label><input id="pass" type="password" autocomplete="${reg ? "new-password" : "current-password"}">
    <p class="err" id="err"></p>
    <button class="primary" id="go">${reg ? "Ro‘yxatdan o‘tish" : "Kirish"}</button>
    <button id="sw">${reg ? "Akkauntim bor" : "Yangi akkaunt ochish"}</button>
  </div>`;
  document.getElementById("sw").onclick = () => showAuth(reg ? "login" : "register");
  document.getElementById("go").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("pass").value;
    const err = document.getElementById("err");
    err.textContent = "";
    const res = reg
      ? await sb.auth.signUp({ email, password, options: { data: { full_name: document.getElementById("name").value.trim() } } })
      : await sb.auth.signInWithPassword({ email, password });
    if (res.error) { err.textContent = "Xatolik: " + res.error.message; return; }
    if (reg && !res.data.session) { err.textContent = "Emailingizga tasdiqlash xati yuborildi. Tasdiqlab, keyin kiring."; return; }
    init();
  };
}

async function logout() { await sb.auth.signOut(); me = null; profile = null; renderNav(); showAuth(); }

/* ---------- Testlar ro‘yxati ---------- */
async function showHome() {
  stopTimer();
  app.innerHTML = "<p>Yuklanmoqda…</p>";
  const [t, p] = await Promise.all([
    sb.from("tests").select("*").order("created_at", { ascending: false }),
    sb.from("purchases").select("test_id,status").eq("user_id", me.id)
  ]);
  const st = {};
  (p.data || []).forEach(x => { if (st[x.test_id] !== "approved") st[x.test_id] = x.status; });
  const tests = t.data || [];
  if (!tests.length) { app.innerHTML = `<h2>Testlar</h2><p class="meta">Hozircha testlar yo‘q.${isAdmin() ? " Admin bo‘limidan test qo‘shing." : ""}</p>`; return; }
  app.innerHTML = `<h2>Testlar</h2><div class="grid">` + tests.map(x => {
    const open = isAdmin() || x.price === 0 || st[x.id] === "approved";
    const action = open
      ? `<button class="primary" onclick="startTest('${x.id}')">Testni boshlash</button>`
      : st[x.id] === "pending"
        ? `<span class="tag">To‘lov tekshirilmoqda</span>`
        : `<button class="primary" onclick="showBuy('${x.id}')">Sotib olish</button>
           ${st[x.id] === "rejected" ? `<span class="err">Oldingi to‘lov qabul qilinmadi</span>` : ""}`;
    return `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>
      <div class="meta">${x.duration_min} daqiqa</div>
      <div class="price">${som(x.price)}</div><div class="spacer"></div>${action}</div>`;
  }).join("") + `</div>`;
}

/* ---------- To‘lov ---------- */
async function showBuy(testId) {
  const { data: t } = await sb.from("tests").select("*").eq("id", testId).single();
  app.innerHTML = `<div class="panel">
    <h2>${esc(t.title)}</h2>
    <p>Narxi: <span class="price">${som(t.price)}</span></p>
    <p>1. Quyidagi kartaga pul o‘tkazing:</p>
    <pre>${esc(CARD_NUMBER)}\n${esc(CARD_OWNER)}</pre>
    <p>2. To‘lov chekining rasmini (skrinshot) yuklang:</p>
    <input type="file" id="file" accept="image/*,application/pdf">
    <p class="err" id="err"></p>
    <button class="primary" id="send">To‘lovni yuborish</button>
    <button onclick="showHome()">Orqaga</button>
    <p class="meta">Admin to‘lovni tekshirgach, test ochiladi.</p></div>`;
  document.getElementById("send").onclick = async () => {
    const f = document.getElementById("file").files[0];
    const err = document.getElementById("err");
    if (!f) { err.textContent = "Chek rasmini tanlang."; return; }
    const path = `${me.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g, "_")}`;
    const up = await sb.storage.from("receipts").upload(path, f);
    if (up.error) { err.textContent = "Yuklashda xatolik: " + up.error.message; return; }
    const ins = await sb.from("purchases").insert({ user_id: me.id, test_id: testId, receipt_path: path });
    if (ins.error) { err.textContent = "Xatolik: " + ins.error.message; return; }
    app.innerHTML = `<div class="panel"><h2>Qabul qilindi</h2><p>To‘lovingiz tekshirilmoqda. Tasdiqlangach, test ochiladi.</p>
      <button class="primary" onclick="showHome()">Testlarga qaytish</button></div>`;
  };
}

/* ---------- Testni topshirish ---------- */
async function startTest(testId) {
  stopTimer();
  const [{ data: t }, { data: qs, error }] = await Promise.all([
    sb.from("tests").select("*").eq("id", testId).single(),
    sb.rpc("get_test_questions", { p_test: testId })
  ]);
  if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  if (!qs.length) { app.innerHTML = `<p>Bu testda hali savollar yo‘q.</p><button onclick="showHome()">Orqaga</button>`; return; }
  let left = t.duration_min * 60;
  app.innerHTML = `<h2>${esc(t.title)}</h2>
    <div class="timer"><span>Qolgan vaqt</span><span id="clock"></span></div>` +
    qs.map((q, i) => `<div class="q"><strong>${i + 1}. ${esc(q.body)}</strong>` +
      q.options.map((o, j) => `<label class="opt"><input type="radio" name="q_${q.id}" value="${j}"><span>${esc(o)}</span></label>`).join("") +
      `</div>`).join("") +
    `<button class="primary" id="finish">Testni yakunlash</button>`;
  const clock = document.getElementById("clock");
  const tick = () => { clock.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`; };
  tick();
  const finish = async () => {
    stopTimer();
    const answers = {};
    qs.forEach(q => { const c = document.querySelector(`input[name="q_${q.id}"]:checked`); if (c) answers[q.id] = Number(c.value); });
    const { data, error } = await sb.rpc("submit_attempt", { p_test: testId, p_answers: answers });
    if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
    showResult(t, qs, data);
  };
  document.getElementById("finish").onclick = () => { if (confirm("Testni yakunlaysizmi?")) finish(); };
  timerId = setInterval(() => { left--; tick(); if (left <= 0) finish(); }, 1000);
}

function showResult(t, qs, r) {
  const rv = {}; r.review.forEach(x => rv[x.id] = x);
  window.scrollTo(0, 0);
  app.innerHTML = `<h2>${esc(t.title)}</h2>
    <div class="score">${r.score} / ${r.total}</div>
    <p class="meta">${Math.round(r.score / r.total * 100)}% to‘g‘ri javob</p>
    <button class="primary" onclick="showHome()">Testlarga qaytish</button><h3 style="margin-top:24px">Javoblar tahlili</h3>` +
    qs.map((q, i) => `<div class="q"><strong>${i + 1}. ${esc(q.body)}</strong>` +
      q.options.map((o, j) => {
        const x = rv[q.id];
        const cls = j === x.correct ? "right" : (j === x.chosen ? "wrong" : "");
        return `<div class="opt ${cls}"><span>${esc(o)}${j === x.correct ? " ✓" : ""}${j === x.chosen && j !== x.correct ? " ✗" : ""}</span></div>`;
      }).join("") + `</div>`).join("");
}

/* ---------- Natijalarim ---------- */
async function showMy() {
  stopTimer();
  const { data } = await sb.from("attempts").select("*, tests(title)").eq("user_id", me.id).order("created_at", { ascending: false });
  app.innerHTML = `<h2>Natijalarim</h2>` + ((data || []).length
    ? data.map(a => `<div class="row"><strong>${esc(a.tests ? a.tests.title : "")}</strong><span class="spacer"></span>
        <span>${a.score} / ${a.total}</span><span class="meta">${new Date(a.created_at).toLocaleString("ru-RU")}</span></div>`).join("")
    : `<p class="meta">Siz hali test topshirmagansiz.</p>`);
}

/* ---------- Admin ---------- */
function showAdmin(tab = "pay") {
  stopTimer();
  app.innerHTML = `<h2>Admin panel</h2><div class="tabs">
    <button class="${tab === "pay" ? "on" : ""}" onclick="showAdmin('pay')">To‘lovlar</button>
    <button class="${tab === "new" ? "on" : ""}" onclick="showAdmin('new')">Test qo‘shish</button>
    <button class="${tab === "list" ? "on" : ""}" onclick="showAdmin('list')">Testlar</button></div><div id="tab"></div>`;
  ({ pay: adminPay, new: adminNew, list: adminList })[tab]();
}

async function adminPay() {
  const box = document.getElementById("tab");
  const { data } = await sb.from("purchases").select("*, profiles(full_name), tests(title,price)").order("created_at", { ascending: false });
  if (!(data || []).length) { box.innerHTML = `<p class="meta">To‘lovlar yo‘q.</p>`; return; }
  box.innerHTML = "";
  for (const p of data) {
    let link = "";
    if (p.receipt_path) {
      const s = await sb.storage.from("receipts").createSignedUrl(p.receipt_path, 3600);
      if (s.data) link = `<a href="${s.data.signedUrl}" target="_blank" rel="noopener">Chekni ko‘rish</a>`;
    }
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<div><strong>${esc(p.profiles ? p.profiles.full_name : "")}</strong><br>
      <span class="meta">${esc(p.tests ? p.tests.title : "")} · ${som(p.tests ? p.tests.price : 0)}</span></div>
      <span class="spacer"></span>${link}<span class="tag">${p.status}</span>
      ${p.status === "pending" ? `<button class="primary" data-s="approved">Tasdiqlash</button><button class="danger" data-s="rejected">Rad etish</button>` : ""}`;
    row.querySelectorAll("button[data-s]").forEach(b => b.onclick = async () => {
      await sb.from("purchases").update({ status: b.dataset.s }).eq("id", p.id);
      adminPay();
    });
    box.appendChild(row);
  }
}

function parseQuestions(txt) {
  return txt.trim().split(/\n\s*\n/).map(block => {
    const lines = block.trim().split("\n").map(l => l.trim()).filter(Boolean);
    const isOpt = l => /^[A-Da-d][\)\.]/.test(l);
    const isAns = l => /^javob\s*:/i.test(l);
    const ans = lines.find(isAns);
    const options = lines.filter(isOpt).map(l => l.replace(/^[A-Da-d][\)\.]\s*/, ""));
    const body = lines.filter(l => !isOpt(l) && !isAns(l)).join(" ");
    const correct = ans ? "ABCD".indexOf(ans.split(":")[1].trim().toUpperCase()[0]) : -1;
    if (!body || options.length < 2 || correct < 0 || correct >= options.length) throw new Error("Savol formati xato: " + block.slice(0, 60));
    return { body, options, correct };
  });
}

function adminNew() {
  document.getElementById("tab").innerHTML = `<div class="panel wide">
    <label>Test nomi</label><input id="t_title">
    <label>Tavsif</label><input id="t_desc">
    <label>Narxi (so‘m, bepul bo‘lsa 0)</label><input id="t_price" type="number" value="0" min="0">
    <label>Davomiyligi (daqiqa)</label><input id="t_dur" type="number" value="30" min="1">
    <label>Savollar</label>
    <textarea id="t_q" rows="12" placeholder="Amir Temur qachon tug‘ilgan?&#10;A) 1320&#10;B) 1336&#10;C) 1360&#10;D) 1405&#10;Javob: B&#10;&#10;Keyingi savol..."></textarea>
    <p class="meta">Har bir savol bo‘sh qator bilan ajratiladi. Variantlar A) B) C) D), oxirida “Javob: B”.</p>
    <p class="err" id="err"></p><button class="primary" id="save">Testni saqlash</button></div>`;
  document.getElementById("save").onclick = async () => {
    const err = document.getElementById("err"); err.textContent = "";
    let qs;
    try { qs = parseQuestions(document.getElementById("t_q").value); } catch (e) { err.textContent = e.message; return; }
    const title = document.getElementById("t_title").value.trim();
    if (!title) { err.textContent = "Test nomini yozing."; return; }
    const { data: t, error } = await sb.from("tests").insert({
      title, description: document.getElementById("t_desc").value.trim(),
      price: Number(document.getElementById("t_price").value) || 0,
      duration_min: Number(document.getElementById("t_dur").value) || 30
    }).select().single();
    if (error) { err.textContent = error.message; return; }
    const r = await sb.from("questions").insert(qs.map((q, i) => ({ ...q, test_id: t.id, position: i })));
    if (r.error) { err.textContent = r.error.message; return; }
    showAdmin("list");
  };
}

async function adminList() {
  const box = document.getElementById("tab");
  const { data } = await sb.from("tests").select("*").order("created_at", { ascending: false });
  box.innerHTML = (data || []).map(t => `<div class="row"><div><strong>${esc(t.title)}</strong><br><span class="meta">${som(t.price)} · ${t.duration_min} daqiqa</span></div>
    <span class="spacer"></span><span class="tag">${t.is_published ? "e‘lon qilingan" : "yashirin"}</span>
    <button data-a="toggle" data-id="${t.id}" data-v="${t.is_published}">${t.is_published ? "Yashirish" : "E‘lon qilish"}</button>
    <button class="danger" data-a="del" data-id="${t.id}">O‘chirish</button></div>`).join("") || `<p class="meta">Testlar yo‘q.</p>`;
  box.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
    if (b.dataset.a === "del") { if (!confirm("Test va uning savollari o‘chiriladi. Davom etasizmi?")) return; await sb.from("tests").delete().eq("id", b.dataset.id); }
    else await sb.from("tests").update({ is_published: b.dataset.v !== "true" }).eq("id", b.dataset.id);
    adminList();
  });
}

init();
</script>
</body>
</html>
